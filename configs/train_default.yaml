# Default PlayParse LoRA run (PRD section 8.4). Override fields with
#   python scripts/train.py --config configs/train_default.yaml --set train.lr=1e-4
model:
  weights: null            # null -> $PLAYPARSE_WEIGHTS (or the repo default); set a path to override
  dtype: auto              # bf16 on cuda/mps, fp32 on cpu
  gradient_checkpointing: false
  attn_implementation: sdpa
lora:
  impl: playparse          # hand-written playparse.lora; adapters saved in PEFT format (peft = reference)
  r: 16
  alpha: 32
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
data:
  train: data/processed/train.jsonl
  val: data/processed/val.jsonl
  max_len: 512
  mask_prompt: true
  on_overlength: raise
train:
  output_dir: runs/default
  seed: 0
  lr: 2.0e-4
  weight_decay: 0.0
  max_grad_norm: 1.0
  epochs: 2
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  micro_batch_size: 16     # effective batch 64 = 16 x 4
  grad_accum_steps: 4
  log_every: 10
  eval_every: 250
  eval_max_examples: 2000
  eval_batch_size: 32
  gen_every: 500
  save_every: 500
  keep_last_checkpoints: 2
  save_best: true
  early_stop_metric: val_exact_match
  early_stop_mode: max
  early_stop_patience: 4
  device: auto
  autocast: auto
gen_eval_examples: 500
gen_max_new_tokens: 160
