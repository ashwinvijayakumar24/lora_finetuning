# P3 local pilot (Apple M4 16 GB, MPS): reduced scale, indicative only.
# Data comes from `python scripts/p3_pilot.py data`. Pass the val path on the command line:
#   python scripts/train.py --config configs/p3_local_pilot.yaml \
#       --set data.val="\"$PLAYPARSE_PROCESSED_DIR/val.jsonl\"" [--resume latest]
model:
  weights: null
  dtype: auto              # bf16 base on MPS; LoRA weights fp32
  gradient_checkpointing: false
  attn_implementation: sdpa
lora:
  impl: playparse
  r: 16
  alpha: 32
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
data:
  train: runs/p3_local_pilot/data/train_pilot.jsonl
  val: null                # set to $PLAYPARSE_PROCESSED_DIR/val.jsonl
  max_len: 768             # the longest pilot example is 521 tokens; 512 would raise
  mask_prompt: true
  on_overlength: raise
  val_loss_examples: 200   # proportional bucket-stratified val sample for val loss
train:
  output_dir: runs/p3_local_pilot/train
  seed: 0
  lr: 2.0e-4
  weight_decay: 0.0
  max_grad_norm: 1.0
  epochs: 1                # 2,400 examples / 8 = 300 optimizer steps
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  micro_batch_size: 1      # micro-batch 4 swaps on 16 GB (docs/issues/p2-mps-activation-memory.md)
  grad_accum_steps: 8
  pad_to_multiple_of: 64   # fixed shapes keep the MPS allocator from fragmenting
  log_every: 5
  eval_every: 75
  eval_batch_size: 8
  gen_every: 100
  save_every: 25           # resumable: at most 25 steps (~6 min) lost on a crash
  keep_last_checkpoints: 2
  save_best: true
  early_stop_metric: val_exact_match
  early_stop_mode: max
  early_stop_patience: null
  device: auto
  autocast: auto           # none on MPS
gen_eval_examples: 90      # 10 per bucket from val (balanced)
gen_eval_seed: 0
gen_eval_strategy: balanced
gen_max_new_tokens: 128
